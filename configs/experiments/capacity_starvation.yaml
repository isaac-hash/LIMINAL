# Stage 2: Capacity-Starvation Experiment (Phase 7 Gate Rescue)
#
# Goal: Force the learned write gate to open by making the internal latent
# graph provably insufficient for the task.
#
# Squeeze strategy:
#   - latent_slots: 3  (down from 8)  — 3 graph nodes vs 6 active entities
#   - task_family: ext_sensitive_hard — 7 turns, 3 people, 3 items
#   - write_sparsity_lambda: 0.0      — NO penalty on writing; let the gate open
#   - write_gate_bias_init: +1.0      — pre-open the gate (vs -1.0 or 0.0)
#   - write_sparsity_warmup_epochs: 0 — no warmup needed (no penalty to ramp up)
#
# Success condition (exit criterion):
#   - mean_slots_written_per_step > 0  (gate opens at all)
#   - gate_entropy > 0.005             (gate is not trivially saturated)
#   - Learned accuracy >= Top-K baseline accuracy
#
# If this passes: the gate CAN open given enough memory pressure.
# Next step: re-introduce a small sparsity_lambda and re-run to demonstrate
# the selectivity trade-off (the original Phase 7 hypothesis).

# === Model — REDUCED CAPACITY ===
model:
  type: graph
  latent_slots: 3          # <<< KEY CHANGE: only 3 internal slots vs 6 entities
  latent_dim: 32
  edge_dim: 1
  msg_hidden_dim: 64
  update_hidden_dim: 64
  num_msg_layers: 1
  reasoning_steps: 4
  max_reasoning_steps: 16
  decoder_hidden_dim: 64
  num_classes: 2

# === Activity (ON) ===
activity:
  enabled: true
  gate_hidden_dim: 32
  sparsity_lambda: 0.005   # reduced (was 0.01) to not fight the write gate
  entropy_lambda: 0.001

# === Resolution (ON) ===
resolution:
  enabled: true
  halt_threshold: 0.8
  ponder_lambda: 0.01
  max_reasoning_steps: 16

# === External Workspace — Phase 7 Learned Gate (NO PENALTY) ===
external:
  enabled: true
  num_slots: 16
  record_dim: 32
  num_types: 7
  write_top_k: 3
  write_dedup: true
  read_heads: 2
  read_gate: true
  edge_adaptation: true
  edge_hidden_dim: 32
  detach_workspace_between_turns: true
  # Learned gate — Stage 2 settings
  learned_gate: true
  gumbel_tau_start: 1.0
  gumbel_tau_end: 0.1
  gumbel_anneal_epochs: 30
  write_sparsity_lambda: 0.0     # <<< NO sparsity penalty — let gate open freely
  write_gate_bias_init: 1.0      # <<< Positive bias — gate starts PRE-OPEN
  write_sparsity_warmup_epochs: 0

# === Persistence (ON) ===
persistence:
  enabled: true
  gate_hidden_dim: 32
  detach_between_turns: true

# === Data — harder 7-turn, 3-person task ===
data:
  task_family: ext_sensitive_hard   # <<< new harder task
  sequence_turns: 7                 # 7 turns per sequence
  ops_per_turn: 1
  incremental_turns: false
  num_train: 3000
  num_val: 500
  num_test: 500
  max_entities: 6                   # 3 people + 3 items
  max_operations: 2
  distractor_ratio: 0.0
  seed: 42

# === Training ===
training:
  epochs: 60
  batch_size: 8
  lr: 3.0e-4                        # slightly lower LR for stability
  weight_decay: 1.0e-5
  grad_clip: 1.0
  scheduler: cosine
  log_every: 10
  eval_every: 1
  checkpoint_dir: results/capacity_starvation

# === Reproducibility ===
seed: 42
