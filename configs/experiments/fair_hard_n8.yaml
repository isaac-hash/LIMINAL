# P4: Fair Dynamics - N=8, Hard Task, Cost-Penalised Gate
#
# Purpose: The causal PAIR to P3 (fair_hard_n3.yaml).
# Tests whether a well-provisioned model (N=8 > 6 entities) suppresses writing
# when it bears a cost, under the same fair conditions as P3.
#
# Expected outcome under the capacity-starvation hypothesis:
#   - N=8 should write FEWER slots than N=3 (or suppress externalisation entirely)
#     because 8 internal slots are sufficient to represent all 6 active entities.
#
# If N=3 writes but N=8 does not (under identical fair dynamics) ->
#   the causal isolation is complete and the hypothesis is validated.
#
# Exit criterion (for the P3/P4 pair):
#   - N=3 mean_slots > 0  AND  N=8 mean_slots < N=3 mean_slots

# === Model - FULL CAPACITY ===
model:
  type: graph
  latent_slots: 8
  latent_dim: 32
  edge_dim: 1
  msg_hidden_dim: 64
  update_hidden_dim: 64
  num_msg_layers: 1
  reasoning_steps: 4
  max_reasoning_steps: 16
  decoder_hidden_dim: 64
  num_classes: 2

# === Activity (ON) ===
activity:
  enabled: true
  gate_hidden_dim: 32
  sparsity_lambda: 0.005
  entropy_lambda: 0.001

# === Resolution (ON) ===
resolution:
  enabled: true
  halt_threshold: 0.8
  ponder_lambda: 0.01
  max_reasoning_steps: 16

# === External Workspace - Phase 7 Learned Gate (FAIR DYNAMICS) ===
external:
  enabled: true
  num_slots: 16
  record_dim: 32
  num_types: 7
  write_top_k: 3
  write_dedup: true
  read_heads: 2
  read_gate: true
  edge_adaptation: true
  edge_hidden_dim: 32
  detach_workspace_between_turns: true
  learned_gate: true
  gumbel_tau_start: 1.0
  gumbel_tau_end: 0.1
  gumbel_anneal_epochs: 30
  write_sparsity_lambda: 0.01
  write_gate_bias_init: 0.0
  write_sparsity_warmup_epochs: 5

# === Persistence (ON) ===
persistence:
  enabled: true
  gate_hidden_dim: 32
  detach_between_turns: true

# === Data - harder 7-turn, 3-person task ===
data:
  task_family: ext_sensitive_hard
  sequence_turns: 7
  ops_per_turn: 1
  incremental_turns: false
  num_train: 3000
  num_val: 500
  num_test: 500
  max_entities: 6
  max_operations: 2
  distractor_ratio: 0.0
  seed: 42

# === Training ===
training:
  epochs: 60
  batch_size: 8
  lr: 3.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  scheduler: cosine
  log_every: 10
  eval_every: 1
  checkpoint_dir: results/fair_hard_n8

# === Reproducibility ===
seed: 42