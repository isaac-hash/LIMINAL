# Phase 7 Externalisation Comparison — Three-Way Ablation Config
# Compares: never-externalise / always-externalise (top-K) / learned-gate
#
# This config defines the LEARNED GATE variant (the primary Phase 7 model).
# Run with --config to compare against:
#   configs/experiments/external_ablation.yaml         (always top-K)
#   configs/baselines/dynamic_graph.yaml               (never externalise)
#
# Exit criterion (Level 2+):
#   Learned gate >= top-K accuracy  AND  mean slots written < top-K
#   i.e., learned gate achieves same accuracy while writing FEWER slots per step.

# === Model ===
model:
  type: graph
  latent_slots: 8
  latent_dim: 32
  edge_dim: 1
  msg_hidden_dim: 64
  update_hidden_dim: 64
  num_msg_layers: 1
  reasoning_steps: 4
  max_reasoning_steps: 16
  decoder_hidden_dim: 64
  num_classes: 2

# === Activity (ON) ===
activity:
  enabled: true
  gate_hidden_dim: 32
  sparsity_lambda: 0.01
  entropy_lambda: 0.001

# === Resolution (ON) ===
resolution:
  enabled: true
  halt_threshold: 0.8
  ponder_lambda: 0.01
  max_reasoning_steps: 16

# === External Workspace — Phase 7 Learned Gate ===
external:
  enabled: true
  num_slots: 16
  record_dim: 32
  num_types: 7
  write_top_k: 3              # fallback K if learned_gate=False; not used here
  write_dedup: true
  read_heads: 2
  read_gate: true
  edge_adaptation: true
  edge_hidden_dim: 32
  detach_workspace_between_turns: true
  # Phase 7 learned gate settings
  learned_gate: true
  gumbel_tau_start: 1.0       # start soft (high entropy write decisions)
  gumbel_tau_end: 0.1         # end near-hard (selective discrete decisions)
  gumbel_anneal_epochs: 30    # anneal over first 30 of 50 epochs
  write_sparsity_lambda: 0.01 # L1 penalty on mean write gate

# === Persistence (ON) ===
persistence:
  enabled: true
  gate_hidden_dim: 32
  detach_between_turns: true

# === Data — harder 5-turn task ===
data:
  task_family: ext_sensitive    # Phase 7 externalisation-sensitive task
  sequence_turns: 5             # 5 turns per sequence (vs 3 in Phase 5)
  ops_per_turn: 1
  incremental_turns: false
  num_train: 3000
  num_val: 500
  num_test: 500
  max_entities: 4
  max_operations: 2
  distractor_ratio: 0.0
  seed: 42

# === Training ===
training:
  epochs: 50
  batch_size: 8
  lr: 5.0e-4                    # slightly lower lr than Phase 5 (more complex loss landscape)
  weight_decay: 1.0e-5
  grad_clip: 1.0
  scheduler: cosine
  log_every: 10
  eval_every: 1
  checkpoint_dir: results/externalisation_comparison

# === Reproducibility ===
seed: 42
