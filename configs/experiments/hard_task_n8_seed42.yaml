# Control Experiment: N=8 on ext_sensitive_hard (7 turns) — Seed 42
# Matches capacity_starvation.yaml in every detail except latent_slots=8.
# Tests whether an internally well-provisioned model also writes heavily under
# the hard task, or whether it suppresses writing relative to N=3.

# === Model — FULL CAPACITY ===
model:
  type: graph
  latent_slots: 8          # <<< Control: N=8 slots
  latent_dim: 32
  edge_dim: 1
  msg_hidden_dim: 64
  update_hidden_dim: 64
  num_msg_layers: 1
  reasoning_steps: 4
  max_reasoning_steps: 16
  decoder_hidden_dim: 64
  num_classes: 2

# === Activity (ON) ===
activity:
  enabled: true
  gate_hidden_dim: 32
  sparsity_lambda: 0.005
  entropy_lambda: 0.001

# === Resolution (ON) ===
resolution:
  enabled: true
  halt_threshold: 0.8
  ponder_lambda: 0.01
  max_reasoning_steps: 16

# === External Workspace — Phase 7 Learned Gate (NO PENALTY) ===
external:
  enabled: true
  num_slots: 16
  record_dim: 32
  num_types: 7
  write_top_k: 3
  write_dedup: true
  read_heads: 2
  read_gate: true
  edge_adaptation: true
  edge_hidden_dim: 32
  detach_workspace_between_turns: true
  # Learned gate settings identical to capacity_starvation.yaml
  learned_gate: true
  gumbel_tau_start: 1.0
  gumbel_tau_end: 0.1
  gumbel_anneal_epochs: 30
  write_sparsity_lambda: 0.0
  write_gate_bias_init: 1.0
  write_sparsity_warmup_epochs: 0

# === Persistence (ON) ===
persistence:
  enabled: true
  gate_hidden_dim: 32
  detach_between_turns: true

# === Data — harder 7-turn, 3-person task ===
data:
  task_family: ext_sensitive_hard
  sequence_turns: 7
  ops_per_turn: 1
  incremental_turns: false
  num_train: 3000
  num_val: 500
  num_test: 500
  max_entities: 6
  max_operations: 2
  distractor_ratio: 0.0
  seed: 42

# === Training ===
training:
  epochs: 60
  batch_size: 8
  lr: 3.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  scheduler: cosine
  log_every: 10
  eval_every: 1
  checkpoint_dir: results/hard_task_n8_seed42

# === Reproducibility ===
seed: 42
