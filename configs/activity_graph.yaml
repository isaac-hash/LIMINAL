# Phase 2A: Adaptive Activity Graph (same architecture as static_graph + activity gates ON)
model:
  type: "graph"
  latent_slots: 8
  latent_dim: 32
  edge_dim: 1
  msg_hidden_dim: 64
  update_hidden_dim: 64
  num_msg_layers: 1
  reasoning_steps: 4
  decoder_hidden_dim: 64
  num_classes: 2

activity:
  enabled: true
  gate_hidden_dim: 32      # Hidden width of the per-slot gate MLP
  sparsity_lambda: 0.01    # L1 penalty weight: encourages fewer active slots
  entropy_lambda: 0.001    # Entropy bonus: encourages binary (0/1) decisions

training:
  epochs: 50
  batch_size: 16
  lr: 1.0e-3
  checkpoint_dir: "results/activity_graph"
